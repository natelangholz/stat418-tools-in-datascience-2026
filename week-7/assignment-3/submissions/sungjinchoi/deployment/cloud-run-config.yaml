# Cloud Run service configuration.
# Apply with: gcloud run services replace deployment/cloud-run-config.yaml --region us-central1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: market-value-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      containers:
        - image: gcr.io/PROJECT_ID/market-value-api
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: MODEL_PATH
              value: /app/model.pkl
            - name: LOG_LEVEL
              value: INFO
            - name: MAX_BATCH_SIZE
              value: "100"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: market-value-api-key
                  key: latest
